name: Nix flake check
on:
  pull_request:
  push:
    branches: [master]


jobs:
  validate:
    runs-on: [self-hosted, nix]
    steps:
      - uses: actions/checkout@v4

      - name: xrefcheck
        run: nix run github:serokell/xrefcheck

      - name: reuse
        run: nix build -L .#checks.x86_64-linux.reuse-lint
        # Run step even if the previous one has failed
        if: success() || failure()

      - name: check-trailing-whitespace
        run: nix build -L .#checks.x86_64-linux.trailing-whitespace
        if: success() || failure()

  daml-test:
    name: Daml test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpm
        run: |
          if ! command -v dpm &> /dev/null; then
            curl https://get.digitalasset.com/install/install.sh | sh
          fi
          echo "$HOME/.dpm/bin" >> $GITHUB_PATH

      - name: Install Daml SDK
        run: |
          if [ ! -d "$HOME/.daml/sdk/3.5.1" ]; then
            dpm install 3.5.1
          fi

      - name: Build and test
        run: |
          dpm build --package-root main
          dpm test --package-root test
